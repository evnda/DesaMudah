
{% extends 'base.html' %}

{% block title %}Dashboard - DesaMudah{% endblock %}

{% block content %}

<div class="form-card">
    <h2>Selamat Datang, {{ session.get('nama') }}!</h2>

    <p>
        Anda berhasil login ke sistem DesaMudah.
    </p>

    <p>
        Role akun:
        <strong>{{ session.get('role') }}</strong>
    </p>

    <a href="{{ url_for('logout') }}">
        <button type="button">Logout</button>
    </a>
</div>

{% endblock %}
